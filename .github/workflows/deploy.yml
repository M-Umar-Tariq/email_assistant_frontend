name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy frontend on VPS
        shell: powershell
        run: |
          Set-Location C:\Users\Administrator\Desktop\apps\email-assistant\frontend
          git fetch origin
          git reset --hard origin/main
          npm install
          npm run build
          pm2 restart email-assistant-frontend
          pm2 save
